name: Terraform Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-main
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./IaC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751948409182:role/github-actions-role
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      ######################################
      # Validate
      ######################################
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      ######################################
      # IaC Security Scan
      ######################################
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: IaC
          quiet: true
          soft_fail: true    # don't block — intentional misconfigs

      ######################################
      # Deploy
      ######################################
      - name: Terraform Plan
        run: terraform plan -lock-timeout=300s

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -lock-timeout=300s
