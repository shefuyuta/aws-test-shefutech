name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./IaC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751948409182:role/github-actions-role
          aws-region: ap-northeast-1

      ##################################
      # Helm でインストールした ALB Controller を先に削除
      # (これをしないと ALB Controller が削除されないまま EKS が消えて孤児リソース化)
      ##################################
      - name: Cleanup Helm Releases (Pre-destroy)
        continue-on-error: true
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/app/eks/cluster_name" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$CLUSTER_NAME" ]; then
            aws eks update-kubeconfig --name $CLUSTER_NAME --region ap-northeast-1 || true
            helm uninstall aws-load-balancer-controller -n kube-system || true
            kubectl delete ingress --all -A || true
            sleep 300   # ALBがAWS側で削除されるのを待つ
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (Reconfigure)
        run: terraform init -reconfigure
      
      - name: Remove Kubernetes resources from state
        run: |
          terraform state list | grep -E "^kubernetes_|^helm_" | while read r; do
            terraform state rm "$r"
          done
        
      - name: Terraform Plan Destroy
        run: |
          echo "==== DESTROY PLAN ===="
          terraform plan -destroy -no-color

      - name: Terraform Destroy
        run: |
          echo "==== START DESTROY ===="
          terraform destroy -auto-approve -no-color -lock-timeout=300s

      - name: Check Terraform State
        run: |
          echo "==== STATE CHECK ===="
          if terraform state list | grep .; then
            echo "⚠️ Resources still remain in state!"
            exit 1
          else
            echo "✅ State is empty"
          fi

      - name: Verify AWS Resources (Filtered)
        run: |
          echo "==== AWS CHECK ===="

          echo "EC2 instances with tag mongo-instance:"
          aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=mongo-instance" \
            --query 'Reservations[].Instances[].InstanceId'

          echo "EKS clusters:"
          aws eks list-clusters --query 'clusters'

          echo "S3 buckets (prefix wiz-backup):"
          aws s3 ls | grep wiz-backup || echo "No matching buckets"
