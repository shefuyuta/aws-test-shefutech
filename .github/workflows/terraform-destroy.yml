name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./IaC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751948409182:role/github-actions-role
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ★ backendを確実に読み込む
      - name: Terraform Init (Reconfigure)
        run: terraform init -reconfigure

      # ★ destroy対象確認（ログ強化）
      - name: Terraform Plan Destroy
        run: |
          echo "==== DESTROY PLAN ===="
          terraform plan -destroy -no-color

      # ★ destroy
      - name: Terraform Destroy
        run: |
          echo "==== START DESTROY ===="
          terraform destroy -auto-approve -no-color

      # ★ state確認（厳密化）
      - name: Check Terraform State
        run: |
          echo "==== STATE CHECK ===="
          if terraform state list | grep .; then
            echo "⚠️ Resources still remain in state!"
            exit 1
          else
            echo "✅ State is empty"
          fi

      # ★ AWS確認（絞り込み）
      - name: Verify AWS Resources (Filtered)
        run: |
          echo "==== AWS CHECK ===="

          echo "EC2 instances with tag mongo-instance:"
          aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=mongo-instance" \
            --query 'Reservations[].Instances[].InstanceId'

          echo "EKS clusters:"
          aws eks list-clusters --query 'clusters'

          echo "S3 buckets (prefix wiz-backup):"
          aws s3 ls | grep wiz-backup || echo "No matching buckets"
